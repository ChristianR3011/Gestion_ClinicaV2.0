<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👨‍⚕️ Registrar Diagnóstico y Tratamiento</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <style>
    :root {
      --primary: #0077b6;
      --secondary: #00b4d8;
      --accent: #03045e;
      --light: #f8f9fa;
      --dark: #212529;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .main-content {
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--border-radius);
      padding: 2rem;
      width: 100%;
      max-width: 800px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .top-bar a {
      text-decoration: none;
      font-size: 1.3rem;
      color: var(--primary);
      font-weight: bold;
      transition: var(--transition);
    }

    .top-bar a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    h1 {
      color: var(--accent);
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--dark);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.6rem;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      transition: var(--transition);
      font-size: 1rem;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      font-weight: 600;
      width: 100%;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .paciente-info {
      background: rgba(240, 250, 255, 0.8);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      display: none;
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .paciente-info h3 {
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }

    .paciente-info p {
      margin: 0;
      color: var(--dark);
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 1rem;
      }

      .container {
        padding: 1.5rem;
      }

      .top-bar {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .btn {
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <main class="main-content">
    <div class="container">
      <div class="top-bar">
        <h1>👨‍⚕️ Registrar Diagnóstico y Tratamiento</h1>
        <a href="principal.html">🏠 Inicio</a>
      </div>

      <div class="form-group">
        <label for="buscarPaciente">Buscar Paciente</label>
        <input type="text" id="buscarPaciente" placeholder="Escribe el nombre del paciente...">
      </div>

      <div id="pacienteInfo" class="paciente-info">
        <h3>Información del Paciente</h3>
        <p id="infoPaciente"></p>
      </div>

      <form id="diagnosticoForm">
        <input type="hidden" id="id_paciente" name="id_paciente">

        <div class="form-group">
          <label for="fecha_registro">Fecha de Registro</label>
          <input type="date" id="fecha_registro" name="fecha_registro" required>
        </div>

        <div class="form-group">
          <label for="motivo_consulta">Motivo de Consulta</label>
          <textarea id="motivo_consulta" name="motivo_consulta" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="diagnostico">Diagnóstico</label>
          <textarea id="diagnostico" name="diagnostico" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="tratamiento">Tratamiento</label>
          <textarea id="tratamiento" name="tratamiento" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn">💾 Guardar Historia Clínica</button>
      </form>
    </div>
  </main>

  <script>
    let pacienteSeleccionado = null;

    $(function() {
      $("#buscarPaciente").autocomplete({
        source: function(request, response) {
          $.getJSON("php/buscar_paciente_autocompletar_historiaC.php", { q: request.term }, function(data) {
            response(data.map(p => ({
              label: `${p.nombres} ${p.apellidos}`,
              value: `${p.nombres} ${p.apellidos}`,
              id: p.id_paciente
            })));
          });
        },
        select: function(event, ui) {
          pacienteSeleccionado = ui.item.id;
          document.getElementById('id_paciente').value = ui.item.id;
          mostrarInfoPaciente(ui.item);
          document.getElementById('pacienteInfo').style.display = 'block';
        }
      });
    });

    function mostrarInfoPaciente(paciente) {
      document.getElementById('infoPaciente').innerHTML = `
        <strong>ID:</strong> ${paciente.id}<br>
        <strong>Nombre:</strong> ${paciente.label}
      `;
    }

    document.getElementById('diagnosticoForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!pacienteSeleccionado) {
        alert('Por favor, selecciona un paciente primero.');
        return;
      }

      const formData = new FormData(this);
      formData.append('id_medico', JSON.parse(localStorage.getItem('usuario')).id_usuario);

      try {
        const response = await fetch('php/guardar_historia.php', {
          method: 'POST',
          body: formData
        });
        const result = await response.text();
        if (result === 'OK') {
          alert('✅ Historia clínica guardada exitosamente.');
          this.reset();
          document.getElementById('pacienteInfo').style.display = 'none';
          pacienteSeleccionado = null;
        } else {
          alert('❌ Error al guardar la historia clínica.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('⚠️ Error de conexión.');
      }
    });
  </script>
</body>
</html>
