<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📊 Reportes Detallados</title>
  <style>
    :root {
      --primary: #0077b6;
      --secondary: #00b4d8;
      --accent: #03045e;
      --light: #f8f9fa;
      --dark: #212529;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      min-height: 100vh;
      padding: 2rem;
      display: grid;
      place-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 1200px;
      min-height: 80vh;
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 3px solid var(--secondary);
    }

    .titulo-principal {
      color: var(--accent);
      font-size: 2.4rem;
      font-weight: 700;
    }

    .top-bar {
      text-decoration: none;
      font-size: 1.3rem;
      color: var(--primary);
      font-weight: bold;
      transition: var(--transition);
    }

    .top-bar:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }

    .filtros label {
      margin-top: 1rem;
    }

    .filtros input {
      padding: 0.8rem;
      border: 2px solid var(--secondary);
      border-radius: 8px;
      transition: var(--transition);
    }

    .filtros input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.1);
    }

    .btn {
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .btn-success {
      background: linear-gradient(135deg, #28a745, #20c997);
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #20c997, #17a2b8);
    }

    .reporte-contenedor {
      margin-top: 2rem;
    }

    .reporte-header {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent);
      font-size: 1.8rem;
      font-weight: 700;
    }

    .grupo {
      margin-bottom: 2rem;
      background: rgba(240, 250, 255, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grupo h3 {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      font-size: 1.4rem;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    th, td {
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 1rem;
      text-align: left;
    }

    th {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: rgba(0, 0, 0, 0.02);
    }

    tr:hover {
      background: rgba(0, 119, 182, 0.05);
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      .container {
        padding: 1.5rem;
        min-height: 70vh;
      }

      .cabecera {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .titulo-principal {
        font-size: 1.8rem;
      }

      .filtros {
        justify-content: center;
      }

      .grupo {
        padding: 1.5rem;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="cabecera">
      <a href="principal.html" class="top-bar">🏠 Inicio</a>
      <h1 class="titulo-principal">📊 Reportes por Especialidad</h1>
      <div>Fecha: <span id="fecha-actualizacion"></span></div>
    </header>

    <div class="filtros">
      <label>Desde: <input type="date" id="desde"></label>
      <label>Hasta: <input type="date" id="hasta"></label>
      <button class="btn" onclick="generarReporte()">Generar Reporte</button>
      <button class="btn btn-success" onclick="exportarPDF()">Exportar a PDF</button>
    </div>

    <div id="reporte" class="reporte-contenedor"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <script>
    let datosReporte = null;
    document.getElementById("fecha-actualizacion").textContent = new Date().toLocaleDateString();

    async function generarReporte() {
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;
      if (!desde || !hasta) return alert('Selecciona ambas fechas');
      const res = await fetch(`php/reportes_detallados.php?desde=${desde}&hasta=${hasta}`);
      const json = await res.json();
      if (!json.success) return alert(json.error);
      datosReporte = json.grupos;
      renderizar(json.grupos, desde, hasta);
    }

    function renderizar(grupos, desde, hasta) {
      const cont = document.getElementById('reporte');
      cont.innerHTML = `<h2 class="reporte-header">Reporte del ${desde} al ${hasta}</h2>`;
      grupos.forEach(g => {
        let html = `<div class="grupo"><h3>${g.especialidad} (${g.citas.length} citas)</h3>`;
        html += `<table><thead><tr>
                   <th>Paciente</th><th>Médico</th><th>Fecha</th><th>Hora</th><th>Motivo</th>
                 </tr></thead><tbody>`;
        g.citas.forEach(c => {
          html += `<tr>
                     <td>${c.paciente}</td>
                     <td>${c.medico}</td>
                     <td>${c.fecha}</td>
                     <td>${c.hora}</td>
                     <td>${c.motivo}</td>
                   </tr>`;
        });
        html += `</tbody></table></div>`;
        cont.innerHTML += html;
      });
    }

    function exportarPDF() {
      if (!datosReporte) return alert('Genera el reporte primero');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const desde = document.getElementById('desde').value;
      const hasta = document.getElementById('hasta').value;

      const logo = new Image();
      logo.src = 'img/logo.png';

      logo.onload = function () {
        doc.addImage(logo, 'PNG', 15, 10, 30, 30);

        // Encabezado centrado
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("Reporte por Especialidad", 105, 20, null, null, "center");

        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.text("Clínica", 105, 30, null, null, "center");
        doc.text(`Período: ${desde} al ${hasta}`, 105, 38, null, null, "center");

        let y = 50;

        datosReporte.forEach(grupo => {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(13);
          doc.text(`Especialidad: ${grupo.especialidad} (${grupo.citas.length} citas)`, 20, y);
          y += 10;

          const rows = grupo.citas.map(cita => [
            cita.paciente,
            cita.medico,
            cita.fecha,
            cita.hora,
            cita.motivo
          ]);

          doc.autoTable({
            startY: y + 5,
            head: [['Paciente', 'Médico', 'Fecha', 'Hora', 'Motivo']],
            body: rows,
            styles: { fontSize: 9 },
            theme: 'grid',
            headStyles: { fillColor: [0, 123, 204] }
          });

          y = doc.lastAutoTable.finalY + 20;
        });

        doc.save(`reporte_${desde}_a_${hasta}.pdf`);
      };
    }
  </script>
</body>
</html>
