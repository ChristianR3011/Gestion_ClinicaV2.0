<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Cita 📅</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <style>
    :root {
      --primary: #0077b6;
      --secondary: #00b4d8;
      --accent: #03045e;
      --light: #f8f9fa;
      --dark: #212529;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .main-content {
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--border-radius);
      padding: 2rem;
      width: 100%;
      max-width: 960px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1, h2 {
      color: var(--accent);
      text-align: center;
      font-weight: 700;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .form-select, .form-control {
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 0.6rem;
      transition: var(--transition);
      font-size: 1rem;
    }

    .form-select:focus, .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.1);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      font-weight: 600;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #6c757d, #495057);
    }

    .btn-secondary:hover {
      background: linear-gradient(135deg, #495057, #343a40);
      transform: translateY(-1px);
    }

    .text-center .btn {
      width: auto;
      min-width: 200px;
    }

    .d-flex.justify-content-between {
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 1rem;
      }

      .container {
        padding: 1.5rem;
      }

      .row.g-3 {
        --bs-gutter-x: 1rem;
        --bs-gutter-y: 1rem;
      }

      .text-center .btn {
        width: 100%;
      }

      .d-flex.justify-content-between {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="main-content">
    <div class="container">
      <h1>Hola, <span id="nombrePaciente"></span> 👋</h1>
      <h2>📅 Solicitar Nueva Cita</h2>

      <form id="form-citas" class="row g-3">
        <input type="hidden" id="id_paciente" name="id_paciente">

        <div class="col-md-6">
          <label for="especialidad" class="form-label">Especialidad 🧪</label>
          <select id="especialidad" class="form-select" required>
            <option value="">Seleccione una especialidad</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="medico" class="form-label">Médico 🩺</label>
          <select id="medico" name="medico" class="form-select" disabled required>
            <option value="">Seleccione un médico</option>
          </select>
        </div>

        <div class="col-12">
          <label for="motivo" class="form-label">Motivo de la cita 📝</label>
          <input type="text" id="motivo" name="motivo" class="form-control" placeholder="Ej. Dolor de cabeza" required>
        </div>

        <div class="col-md-6">
          <label for="fecha" class="form-label">Fecha 📅</label>
          <input type="date" id="fecha" name="fecha" class="form-control" disabled required>
        </div>

        <div class="col-md-6">
          <label for="hora" class="form-label">Hora ⏰</label>
          <select id="hora" name="hora" class="form-select" disabled required>
            <option value="">Seleccione una hora</option>
          </select>
        </div>

        <div class="col-12 text-center">
          <button type="submit" class="btn w-50">Guardar Cita 💾</button>
        </div>

        <div class="col-12 d-flex justify-content-between mt-3">
          <button type="button" class="btn btn-secondary" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

  <script>
    // 1) Cargar datos de paciente desde localStorage
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    console.log(usuario);

    if (!usuario || usuario.rol !== 'paciente') {
      alert('Acceso no autorizado');
      window.location.href = 'index.html';
    }

    document.getElementById('nombrePaciente').textContent = usuario.nombre;
    document.getElementById('id_paciente').value = usuario.id_usuario;

    // Cargar especialidades
    $.getJSON('php/obtener_especialidades_citas_administrador.php', datos => {
      datos.forEach(e => {
        $('#especialidad').append(`<option value="${e.id_especialidad}">${e.nombre}</option>`);
      });
    });

    // Configurar select de médicos según especialidad
    $('#especialidad').on('change', function() {
      const idEsp = $(this).val();
      if (idEsp) {
        cargarMedicos(idEsp);
      } else {
        $('#medico').prop('disabled', true).empty().append('<option value="">Seleccione un médico</option>');
        $('#fecha').prop('disabled', true).val('');
        $('#hora').prop('disabled', true).empty().append('<option value="">Seleccione una hora</option>');
      }
    });

    function cargarMedicos(idEspecialidad) {
      $('#medico').prop('disabled', true).empty().append('<option>Cargando…</option>');
      $('#fecha').prop('disabled', true).val('');
      $('#hora').prop('disabled', true).empty().append('<option>Seleccione una hora</option>');

      $.getJSON('php/buscar_medico_citas_admi.php', {
        tipo: 'medico',
        especialidad: idEspecialidad
      }, function(data) {
        $('#medico').empty().append('<option value="">Seleccione un médico</option>');
        data.forEach(item => {
          $('#medico').append(`<option value="${item.id}">${item.nombre}</option>`);
        });
        $('#medico').prop('disabled', false);
      });
    }

    $('#medico').on('change', function() {
      const idMed = $(this).val();
      if (idMed) {
        cargarFechasDisponibles(idMed);
      } else {
        $('#fecha').prop('disabled', true).val('');
        $('#hora').prop('disabled', true).empty().append('<option>Seleccione una hora</option>');
      }
    });

    // Cargar fechas disponibles
    function cargarFechasDisponibles(idMedico) {
      $.getJSON('php/obtener_fechas_disponibles.php', { id_medico: idMedico }, data => {
        if (data.length) {
          $('#fecha').prop('disabled', false)
                      .attr('min', data[0])
                      .attr('max', data.at(-1));
        } else {
          alert('⚠️ No hay fechas disponibles');
          $('#fecha').prop('disabled', true).val('');
        }
        $('#hora').prop('disabled', true).empty().append('<option>Seleccione una hora</option>');
      });
    }

    // Cargar horas disponibles al elegir fecha
    $('#fecha').on('change', function() {
      const idMed = $('#medico').val(), fec = $(this).val();
      if (!idMed || !fec) return;
      $('#hora').prop('disabled', false).empty().append('<option>Cargando…</option>');
      $.getJSON('php/obtener_horas_admin.php', { id_medico: idMed, fecha: fec }, res => {
        $('#hora').empty().append('<option value="">Seleccione una hora</option>');
        if (res.success && res.horas.length) {
          res.horas.forEach(h => $('#hora').append(`<option value="${h}">${h}</option>`));
        } else {
          $('#hora').append('<option disabled>Sin disponibilidad</option>');
          $('#hora').prop('disabled', true);
        }
      });
    });

    // Envia formulario de cita
    $('#form-citas').submit(function(e) {
      e.preventDefault();
      const payload = {
        id_paciente: $('#id_paciente').val(),
        id_medico: $('#medico').val(),
        fecha_cita: $('#fecha').val(),
        hora_cita: $('#hora').val(),
        motivo_consulta: $('#motivo').val()
      };
      // Aqui llamare al script de paciente
      $.post('php/guardar_cita_paciente.php', payload, res => {
        if (res.success) {
          alert('✅ Cita registrada correctamente.');
          this.reset();
          $('#medico, #fecha, #hora').prop('disabled', true);
          $('#medico').empty().append('<option value="">Seleccione un médico</option>');
          $('#hora').empty().append('<option>Seleccione una hora</option>');
        } else {
          alert('❌ ' + (res.error || 'Error al registrar la cita.'));
        }
      }, 'json')
      .fail(() => alert('❌ Error de comunicación con el servidor.'));
    });

    function cerrarSesion() {
      localStorage.removeItem('usuario');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
